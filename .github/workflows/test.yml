name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/klask/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Klask frontend dependencies
        run: npm --prefix frontend/klask ci

      - name: Build Klask frontend
        run: npm --prefix frontend/klask run build

      - name: Run logic tests with coverage
        run: npm run test:coverage
